<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="720" fill="#f8fafc" rx="14"/>
  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Multi-Agent Research System — System Overview</text>
  <text x="500" y="58" text-anchor="middle" font-size="12" fill="#64748b">LangGraph · deterministic router · VERIFY re-research loop · 3-level tracing · OpenAI→Anthropic→fallback</text>
  <line x1="60" y1="68" x2="940" y2="68" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- trace_run boundary -->
  <rect x="60" y="76" width="880" height="568" rx="12" fill="none" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="10,5"/>
  <text x="80" y="94" font-size="11" fill="#7c3aed" font-weight="bold">trace_run("cli.baseline" | "cli.multi_agent")</text>

  <!-- User Query -->
  <rect x="400" y="102" width="200" height="48" rx="10" fill="#3b82f6" stroke="#2563eb" stroke-width="2"/>
  <text x="500" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="white">User Query</text>
  <text x="500" y="141" text-anchor="middle" font-size="10" fill="#bfdbfe">ResearchQuery · ResearchState</text>

  <!-- START -->
  <line x1="500" y1="150" x2="500" y2="176" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <ellipse cx="500" cy="190" rx="42" ry="18" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="500" y="195" text-anchor="middle" font-size="11" font-weight="bold" fill="white">START</text>

  <!-- Supervisor -->
  <line x1="500" y1="208" x2="500" y2="238" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="310" y="238" width="380" height="78" rx="10" fill="#7c3aed" stroke="#6d28d9" stroke-width="2"/>
  <text x="500" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Supervisor Node — deterministic</text>
  <text x="500" y="280" text-anchor="middle" font-size="10" fill="#e9d5ff">_determine_route(state): verification_queries? → researcher</text>
  <text x="500" y="296" text-anchor="middle" font-size="10" fill="#c4b5fd">no sources → researcher · no analysis → analyst · no critic → critic · no answer → writer · done</text>
  <text x="500" y="312" text-anchor="middle" font-size="10" fill="#a78bfa">guardrail: iteration ≥ max_iterations(6) → force "done"</text>

  <!-- Branch arrows from Supervisor -->
  <line x1="360" y1="316" x2="118" y2="378" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="415" y1="316" x2="300" y2="378" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="585" y1="316" x2="700" y2="378" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="640" y1="316" x2="882" y2="378" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="160" y="366" font-size="10" fill="#7c3aed">researcher</text>
  <text x="310" y="366" font-size="10" fill="#7c3aed">analyst</text>
  <text x="660" y="366" font-size="10" fill="#7c3aed">critic</text>
  <text x="855" y="366" font-size="10" fill="#7c3aed">writer</text>

  <!-- Researcher -->
  <rect x="68" y="378" width="200" height="70" rx="8" fill="#0891b2" stroke="#0e7490" stroke-width="2"/>
  <text x="168" y="402" text-anchor="middle" font-size="12" font-weight="bold" fill="white">ResearcherAgent</text>
  <text x="168" y="418" text-anchor="middle" font-size="10" fill="#bae6fd">SearchClient: Tavily→Serper→local</text>
  <text x="168" y="432" text-anchor="middle" font-size="10" fill="#bae6fd">search_cost + llm_cost tracked</text>
  <text x="168" y="446" text-anchor="middle" font-size="9" fill="#7dd3fc">→ sources + research_notes</text>

  <!-- Analyst -->
  <rect x="278" y="378" width="200" height="70" rx="8" fill="#059669" stroke="#047857" stroke-width="2"/>
  <text x="378" y="402" text-anchor="middle" font-size="12" font-weight="bold" fill="white">AnalystAgent</text>
  <text x="378" y="418" text-anchor="middle" font-size="10" fill="#a7f3d0">reads: research_notes</text>
  <text x="378" y="432" text-anchor="middle" font-size="10" fill="#a7f3d0">LLMClient → analysis_notes</text>
  <text x="378" y="446" text-anchor="middle" font-size="9" fill="#6ee7b7">input/output/cost tracked</text>

  <!-- Critic -->
  <rect x="600" y="378" width="200" height="70" rx="8" fill="#d97706" stroke="#b45309" stroke-width="2"/>
  <text x="700" y="402" text-anchor="middle" font-size="12" font-weight="bold" fill="white">CriticAgent</text>
  <text x="700" y="418" text-anchor="middle" font-size="10" fill="#fde68a">reads: analysis_notes</text>
  <text x="700" y="432" text-anchor="middle" font-size="10" fill="#fde68a">→ critic_notes + VERIFY: lines</text>
  <text x="700" y="446" text-anchor="middle" font-size="9" fill="#fef08a">input/output/cost tracked</text>

  <!-- Writer -->
  <rect x="822" y="378" width="110" height="70" rx="8" fill="#dc2626" stroke="#b91c1c" stroke-width="2"/>
  <text x="877" y="402" text-anchor="middle" font-size="12" font-weight="bold" fill="white">WriterAgent</text>
  <text x="877" y="418" text-anchor="middle" font-size="10" fill="#fecaca">→ final_answer</text>
  <text x="877" y="432" text-anchor="middle" font-size="10" fill="#fecaca">next_agent=done</text>
  <text x="877" y="446" text-anchor="middle" font-size="9" fill="#fca5a5">cost tracked</text>

  <!-- Loop back arrows to Supervisor -->
  <line x1="168" y1="448" x2="350" y2="316" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrGray)"/>
  <line x1="378" y1="448" x2="415" y2="316" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrGray)"/>
  <line x1="700" y1="448" x2="580" y2="316" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrGray)"/>
  <line x1="877" y1="448" x2="640" y2="316" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrGray)"/>

  <!-- VERIFY re-research loop -->
  <path d="M 700 460 Q 500 510 200 460" stroke="#d97706" fill="none" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrOrange)"/>
  <text x="450" y="506" text-anchor="middle" font-size="10" fill="#d97706" font-style="italic">VERIFY: → verification_queries → Supervisor re-routes to Researcher</text>

  <!-- done arrow -->
  <line x1="500" y1="316" x2="500" y2="530" stroke="#16a34a" stroke-width="2" marker-end="url(#arrGreen)"/>
  <text x="512" y="516" font-size="10" fill="#16a34a">done</text>
  <ellipse cx="500" cy="548" rx="42" ry="18" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="500" y="553" text-anchor="middle" font-size="11" font-weight="bold" fill="white">END</text>

  <!-- Shared State -->
  <rect x="68" y="582" width="460" height="50" rx="8" fill="#f1f5f9" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="7,4"/>
  <text x="298" y="603" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">ResearchState (shared)</text>
  <text x="298" y="620" text-anchor="middle" font-size="9" fill="#475569">query · sources · research_notes · analysis_notes · critic_notes · final_answer · verification_queries · route_history · iteration · errors · trace</text>

  <!-- Tracing -->
  <rect x="548" y="582" width="392" height="50" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="744" y="603" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">3-Level Tracing (Langfuse)</text>
  <text x="744" y="620" text-anchor="middle" font-size="9" fill="#166534">trace_run (CLI root) → trace_span (each agent) → trace_generation (each LLM call: prompt/completion/tokens/cost)</text>

  <!-- Legend -->
  <rect x="68" y="646" width="864" height="28" rx="6" fill="#fafafa" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="84" y="658" width="10" height="10" fill="#3b82f6" rx="2"/><text x="100" y="668" font-size="10" fill="#475569">Input</text>
  <rect x="148" y="658" width="10" height="10" fill="#7c3aed" rx="2"/><text x="164" y="668" font-size="10" fill="#475569">Supervisor</text>
  <rect x="236" y="658" width="10" height="10" fill="#0891b2" rx="2"/><text x="252" y="668" font-size="10" fill="#475569">Researcher</text>
  <rect x="330" y="658" width="10" height="10" fill="#059669" rx="2"/><text x="346" y="668" font-size="10" fill="#475569">Analyst</text>
  <rect x="406" y="658" width="10" height="10" fill="#d97706" rx="2"/><text x="422" y="668" font-size="10" fill="#475569">Critic</text>
  <rect x="470" y="658" width="10" height="10" fill="#dc2626" rx="2"/><text x="486" y="668" font-size="10" fill="#475569">Writer</text>
  <line x1="540" y1="663" x2="562" y2="663" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2"/><text x="568" y="668" font-size="10" fill="#475569">loop back</text>
  <line x1="650" y1="663" x2="672" y2="663" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,2"/><text x="678" y="668" font-size="10" fill="#475569">VERIFY re-research</text>
  <line x1="796" y1="663" x2="818" y2="663" stroke="#16a34a" stroke-width="2"/><text x="824" y="668" font-size="10" fill="#475569">done</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748b"/></marker>
    <marker id="arrGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#94a3b8"/></marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#16a34a"/></marker>
    <marker id="arrOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#d97706"/></marker>
  </defs>
</svg>
