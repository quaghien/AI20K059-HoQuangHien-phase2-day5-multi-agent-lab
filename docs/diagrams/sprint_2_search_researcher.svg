<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="640" fill="#f8fafc" rx="12"/>
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">Sprint 2: Search and Researcher</text>
  <text x="450" y="55" text-anchor="middle" font-size="12" fill="#64748b">SearchClient: Tavily(0.008$/credit)→Serper(0.001$/query)→local · ResearcherAgent · cost tracking</text>
  <line x1="60" y1="65" x2="840" y2="65" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- trace_span boundary -->
  <rect x="68" y="74" width="764" height="490" rx="10" fill="none" stroke="#bae6fd" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="86" y="90" font-size="10" fill="#0891b2" font-weight="bold">trace_span("agent.researcher")</text>

  <!-- Input state -->
  <rect x="300" y="98" width="300" height="52" rx="10" fill="#3b82f6" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="white">ResearchState (input)</text>
  <text x="450" y="139" text-anchor="middle" font-size="10" fill="#bfdbfe">state.request.query · state.verification_queries</text>

  <line x1="450" y1="150" x2="450" y2="178" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>

  <!-- ResearcherAgent -->
  <rect x="258" y="178" width="384" height="52" rx="10" fill="#0891b2" stroke="#0e7490" stroke-width="2"/>
  <text x="450" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="white">ResearcherAgent.run()</text>
  <text x="450" y="219" text-anchor="middle" font-size="10" fill="#bae6fd">search_query = verification_queries (if any) else request.query</text>

  <!-- Arrow to SearchClient -->
  <line x1="350" y1="230" x2="220" y2="272" stroke="#64748b" stroke-width="1.8" marker-end="url(#a2)"/>

  <!-- SearchClient -->
  <rect x="76" y="272" width="288" height="60" rx="10" fill="#7c3aed" stroke="#6d28d9" stroke-width="2"/>
  <text x="220" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="white">SearchClient.search(query, max_results)</text>
  <text x="220" y="315" text-anchor="middle" font-size="10" fill="#e9d5ff">records last_search_metadata: {provider_used, estimated_cost_usd}</text>

  <!-- Three providers -->
  <line x1="130" y1="332" x2="130" y2="364" stroke="#64748b" stroke-width="1.5" marker-end="url(#a2)"/>
  <line x1="220" y1="332" x2="220" y2="364" stroke="#64748b" stroke-width="1.5" marker-end="url(#a2)"/>
  <line x1="310" y1="332" x2="310" y2="364" stroke="#64748b" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="76" y="352" font-size="9" fill="#64748b">1st</text>
  <text x="192" y="352" font-size="9" fill="#64748b">2nd</text>
  <text x="278" y="352" font-size="9" fill="#64748b">3rd</text>

  <!-- Tavily -->
  <rect x="76" y="364" width="108" height="72" rx="8" fill="#059669" stroke="#047857" stroke-width="1.5"/>
  <text x="130" y="387" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Tavily</text>
  <text x="130" y="403" text-anchor="middle" font-size="9" fill="#a7f3d0">TavilyClient.search()</text>
  <text x="130" y="418" text-anchor="middle" font-size="9" fill="#a7f3d0">0.008 USD/credit</text>
  <text x="130" y="433" text-anchor="middle" font-size="9" fill="#a7f3d0">TAVILY_API_KEY</text>

  <!-- Serper -->
  <rect x="196" y="364" width="108" height="72" rx="8" fill="#0891b2" stroke="#0e7490" stroke-width="1.5"/>
  <text x="250" y="387" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Serper</text>
  <text x="250" y="403" text-anchor="middle" font-size="9" fill="#bae6fd">serper.dev/search</text>
  <text x="250" y="418" text-anchor="middle" font-size="9" fill="#bae6fd">0.001 USD/query</text>
  <text x="250" y="433" text-anchor="middle" font-size="9" fill="#bae6fd">SERPER_API_KEY</text>

  <!-- Local fallback -->
  <rect x="316" y="364" width="108" height="72" rx="8" fill="#d97706" stroke="#b45309" stroke-width="1.5"/>
  <text x="370" y="387" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Local</text>
  <text x="370" y="403" text-anchor="middle" font-size="9" fill="#fde68a">_fallback_results()</text>
  <text x="370" y="418" text-anchor="middle" font-size="9" fill="#fde68a">static SourceDocs</text>
  <text x="370" y="433" text-anchor="middle" font-size="9" fill="#fde68a">0 USD</text>

  <!-- SourceDocument returned -->
  <line x1="220" y1="436" x2="390" y2="272" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#aGray2)"/>
  <text x="260" y="360" font-size="9" fill="#64748b" transform="rotate(-40,260,360)">list[SourceDocument]</text>

  <!-- Arrow: Researcher → LLMClient -->
  <line x1="550" y1="230" x2="660" y2="272" stroke="#64748b" stroke-width="1.8" marker-end="url(#a2)"/>

  <!-- LLMClient -->
  <rect x="530" y="272" width="294" height="76" rx="10" fill="#7c3aed" stroke="#6d28d9" stroke-width="2"/>
  <text x="677" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="white">LLMClient.complete()</text>
  <text x="677" y="316" text-anchor="middle" font-size="10" fill="#e9d5ff">trace_generation("llm.complete")</text>
  <text x="677" y="334" text-anchor="middle" font-size="10" fill="#e9d5ff">summarize sources → research_notes</text>

  <!-- Arrow: LLMClient → State -->
  <line x1="677" y1="348" x2="560" y2="432" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#aGray2)"/>

  <!-- Updated State -->
  <rect x="300" y="460" width="480" height="90" rx="10" fill="#f1f5f9" stroke="#0891b2" stroke-width="1.5" stroke-dasharray="7,3"/>
  <text x="540" y="483" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">ResearchState (updated)</text>
  <text x="540" y="501" text-anchor="middle" font-size="10" fill="#475569">state.sources = list[SourceDocument]</text>
  <text x="540" y="517" text-anchor="middle" font-size="10" fill="#475569">state.research_notes = str · status="research_ready" · next_agent="analyst"</text>
  <text x="540" y="533" text-anchor="middle" font-size="10" fill="#475569">AgentResult.metadata: search_provider · search_cost_usd · llm_cost_usd · cost_usd · tokens</text>

  <!-- Out of scope -->
  <rect x="68" y="578" width="574" height="22" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="355" y="593" text-anchor="middle" font-size="10" fill="#92400e"><tspan font-weight="bold">Out of scope: </tspan>Analyst comparison · Final answer · Supervisor routing graph</text>

  <defs>
    <marker id="a2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748b"/></marker>
    <marker id="aGray2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#94a3b8"/></marker>
  </defs>
</svg>
