<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="620" fill="#f8fafc" rx="12"/>
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">Sprint 5: Writer, Benchmark, Judge, and Report</text>
  <text x="450" y="55" text-anchor="middle" font-size="12" fill="#64748b">WriterAgent · run_benchmark · BenchmarkMetrics · LLM-as-a-Judge · benchmark_report.md</text>
  <line x1="60" y1="65" x2="840" y2="65" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Input state -->
  <rect x="210" y="80" width="480" height="52" rx="10" fill="#d97706" stroke="#b45309" stroke-width="2"/>
  <text x="450" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="white">ResearchState (critique_ready — from Sprint 4)</text>
  <text x="450" y="121" text-anchor="middle" font-size="10" fill="#fde68a">research_notes · analysis_notes · critic_notes · sources</text>

  <line x1="450" y1="132" x2="450" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#a5)"/>

  <!-- WriterAgent -->
  <rect x="68" y="160" width="764" height="88" rx="10" fill="none" stroke="#fecaca" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="86" y="176" font-size="10" fill="#dc2626" font-weight="bold">trace_span("agent.writer")</text>
  <rect x="240" y="182" width="420" height="58" rx="10" fill="#dc2626" stroke="#b91c1c" stroke-width="2"/>
  <text x="450" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="white">WriterAgent.run()</text>
  <text x="450" y="223" text-anchor="middle" font-size="10" fill="#fecaca">guard: needs analysis_notes AND critic_notes → ValidationError("writer:missing_required_notes")</text>
  <text x="450" y="238" text-anchor="middle" font-size="10" fill="#fca5a5">LLMClient.complete() → final_answer · AgentResult.metadata: input/output/cost · next_agent="done"</text>

  <line x1="450" y1="248" x2="450" y2="278" stroke="#64748b" stroke-width="2" marker-end="url(#a5)"/>

  <!-- Benchmark -->
  <rect x="68" y="278" width="764" height="64" rx="10" fill="#7c3aed" stroke="#6d28d9" stroke-width="2"/>
  <text x="450" y="304" text-anchor="middle" font-size="13" font-weight="bold" fill="white">run_benchmark(queries: 3–5 samples)</text>
  <text x="450" y="322" text-anchor="middle" font-size="10" fill="#e9d5ff">BenchmarkMetrics: run_name · latency_seconds · estimated_cost_usd · quality_score(0–10) · citation_coverage(0–1) · notes</text>

  <!-- Fork -->
  <line x1="300" y1="342" x2="196" y2="386" stroke="#64748b" stroke-width="1.8" marker-end="url(#a5)"/>
  <line x1="600" y1="342" x2="704" y2="386" stroke="#64748b" stroke-width="1.8" marker-end="url(#a5)"/>
  <text x="196" y="374" font-size="9" fill="#64748b" text-anchor="middle">single-agent</text>
  <text x="704" y="374" font-size="9" fill="#64748b" text-anchor="middle">multi-agent</text>

  <!-- Single agent -->
  <rect x="80" y="386" width="232" height="70" rx="10" fill="#475569" stroke="#334155" stroke-width="2"/>
  <text x="196" y="410" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Single-Agent Baseline</text>
  <text x="196" y="428" text-anchor="middle" font-size="10" fill="#cbd5e1">1× LLMClient.complete()</text>
  <text x="196" y="444" text-anchor="middle" font-size="10" fill="#cbd5e1">no search · no routing</text>
  <text x="196" y="456" text-anchor="middle" font-size="9" fill="#94a3b8">→ BenchmarkMetrics</text>

  <!-- Multi agent -->
  <rect x="588" y="386" width="232" height="70" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="704" y="410" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Multi-Agent Pipeline</text>
  <text x="704" y="428" text-anchor="middle" font-size="10" fill="#94a3b8">MultiAgentWorkflow.run()</text>
  <text x="704" y="444" text-anchor="middle" font-size="10" fill="#94a3b8">Supervisor + 4 agents</text>
  <text x="704" y="456" text-anchor="middle" font-size="9" fill="#64748b">→ BenchmarkMetrics</text>

  <!-- LLM Judge -->
  <line x1="196" y1="456" x2="364" y2="506" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#aGray5)"/>
  <line x1="704" y1="456" x2="536" y2="506" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#aGray5)"/>

  <rect x="280" y="506" width="340" height="60" rx="10" fill="#d97706" stroke="#b45309" stroke-width="2"/>
  <text x="450" y="530" text-anchor="middle" font-size="13" font-weight="bold" fill="white">LLM-as-a-Judge</text>
  <text x="450" y="547" text-anchor="middle" font-size="10" fill="#fde68a">same rubric for both runs · quality_score: 0–10</text>
  <text x="450" y="563" text-anchor="middle" font-size="10" fill="#fde68a">fail → quality_score=None, note error in BenchmarkMetrics.notes</text>

  <line x1="450" y1="566" x2="450" y2="586" stroke="#64748b" stroke-width="2" marker-end="url(#a5)"/>

  <!-- Report -->
  <rect x="140" y="586" width="620" height="22" rx="6" fill="#059669" stroke="#047857" stroke-width="1.5"/>
  <text x="450" y="601" text-anchor="middle" font-size="11" font-weight="bold" fill="white">reports/benchmark_report.md — latency · cost · quality_score · citation_coverage · explanation per run</text>

  <defs>
    <marker id="a5" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748b"/></marker>
    <marker id="aGray5" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#94a3b8"/></marker>
  </defs>
</svg>
