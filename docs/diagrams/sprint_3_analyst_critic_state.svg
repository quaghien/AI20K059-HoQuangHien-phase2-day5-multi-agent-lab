<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="660" fill="#f8fafc" rx="12"/>
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">Sprint 3: Analyst, Critic, and State</text>
  <text x="450" y="55" text-anchor="middle" font-size="12" fill="#64748b">ResearchState handoff · AnalystAgent · CriticAgent · VERIFY re-research loop · cost tracking</text>
  <line x1="60" y1="65" x2="840" y2="65" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Input -->
  <rect x="250" y="80" width="400" height="52" rx="10" fill="#0891b2" stroke="#0e7490" stroke-width="2"/>
  <text x="450" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="white">ResearchState (from Researcher)</text>
  <text x="450" y="121" text-anchor="middle" font-size="10" fill="#bae6fd">sources · research_notes · status="research_ready" · next_agent="analyst"</text>

  <line x1="450" y1="132" x2="450" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#a3)"/>

  <!-- Analyst trace_span -->
  <rect x="68" y="160" width="764" height="112" rx="10" fill="none" stroke="#a7f3d0" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="86" y="176" font-size="10" fill="#059669" font-weight="bold">trace_span("agent.analyst")</text>

  <rect x="240" y="184" width="420" height="76" rx="10" fill="#059669" stroke="#047857" stroke-width="2"/>
  <text x="450" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="white">AnalystAgent.run()</text>
  <text x="450" y="226" text-anchor="middle" font-size="10" fill="#a7f3d0">guard: not research_notes → ValidationError("analyst:missing_research_notes")</text>
  <text x="450" y="243" text-anchor="middle" font-size="10" fill="#a7f3d0">LLMClient.complete() → analysis_notes (key claims · trade-offs · weak evidence)</text>
  <text x="450" y="259" text-anchor="middle" font-size="10" fill="#6ee7b7">AgentResult.metadata: input_tokens · output_tokens · cost_usd · used_research_notes=True</text>

  <!-- State after Analyst annotation -->
  <rect x="694" y="192" width="130" height="52" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
  <text x="759" y="212" text-anchor="middle" font-size="10" fill="#15803d" font-weight="bold">After Analyst</text>
  <text x="759" y="228" text-anchor="middle" font-size="9" fill="#166534">+ analysis_notes</text>
  <text x="759" y="242" text-anchor="middle" font-size="9" fill="#166534">next_agent="critic"</text>

  <line x1="450" y1="272" x2="450" y2="304" stroke="#64748b" stroke-width="2" marker-end="url(#a3)"/>

  <!-- Critic trace_span -->
  <rect x="68" y="304" width="764" height="148" rx="10" fill="none" stroke="#fde68a" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="86" y="320" font-size="10" fill="#d97706" font-weight="bold">trace_span("agent.critic")</text>

  <rect x="220" y="328" width="460" height="112" rx="10" fill="#d97706" stroke="#b45309" stroke-width="2"/>
  <text x="450" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="white">CriticAgent.run()</text>
  <text x="450" y="370" text-anchor="middle" font-size="10" fill="#fde68a">guard: not analysis_notes → ValidationError("critic:missing_analysis_notes")</text>
  <text x="450" y="388" text-anchor="middle" font-size="10" fill="#fde68a">LLMClient.complete() → critic_notes (supported · weak claims · fixes)</text>
  <text x="450" y="406" text-anchor="middle" font-size="10" fill="#1a1100" font-weight="bold">_extract_verification_queries(): parse lines "VERIFY: &lt;query&gt;"</text>
  <text x="450" y="424" text-anchor="middle" font-size="10" fill="#fde68a">if queries → status="needs_more_research", next_agent="researcher"</text>
  <text x="450" y="437" text-anchor="middle" font-size="10" fill="#6ee7b7">AgentResult.metadata: verification_queries · input_tokens · output_tokens · cost_usd</text>

  <!-- State after Critic annotation -->
  <rect x="694" y="336" width="130" height="68" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="759" y="356" text-anchor="middle" font-size="10" fill="#c2410c" font-weight="bold">After Critic</text>
  <text x="759" y="372" text-anchor="middle" font-size="9" fill="#9a3412">+ critic_notes</text>
  <text x="759" y="387" text-anchor="middle" font-size="9" fill="#9a3412">+ verification_queries</text>
  <text x="759" y="402" text-anchor="middle" font-size="9" fill="#9a3412">next: writer|researcher</text>

  <!-- VERIFY loop -->
  <path d="M 450 452 Q 100 490 140 132" stroke="#d97706" fill="none" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#aOrange3)"/>
  <text x="68" y="348" font-size="10" fill="#d97706" font-style="italic">VERIFY:</text>
  <text x="68" y="362" font-size="10" fill="#d97706" font-style="italic">re-research</text>
  <text x="68" y="376" font-size="10" fill="#d97706" font-style="italic">loop</text>

  <!-- Normal path -->
  <line x1="450" y1="452" x2="450" y2="482" stroke="#64748b" stroke-width="2" marker-end="url(#a3)"/>
  <text x="462" y="473" font-size="9" fill="#16a34a">no VERIFY → writer</text>

  <!-- Final State -->
  <rect x="160" y="482" width="580" height="82" rx="10" fill="#f1f5f9" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="7,3"/>
  <text x="450" y="505" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">ResearchState (ready for Writer)</text>
  <text x="450" y="522" text-anchor="middle" font-size="10" fill="#475569">sources · research_notes · analysis_notes · critic_notes · verification_queries=[]</text>
  <text x="450" y="538" text-anchor="middle" font-size="10" fill="#475569">status="critique_ready" · next_agent="writer" · agent_results=[RESEARCHER,ANALYST,CRITIC]</text>

  <!-- State fields added -->
  <rect x="68" y="578" width="764" height="40" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="450" y="596" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">ResearchState fields added in this sprint</text>
  <text x="450" y="613" text-anchor="middle" font-size="10" fill="#1e40af">analysis_notes · critic_notes · verification_queries · judge_score · status · next_agent</text>

  <defs>
    <marker id="a3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748b"/></marker>
    <marker id="aOrange3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#d97706"/></marker>
  </defs>
</svg>
